[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tenure-agent-trust"
version = "0.1.0"
description = "Continuous, evidence-backed authority for enterprise AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TENURE" }]
dependencies = []

[project.optional-dependencies]
agent = [
  "google-adk>=2.1,<3",
  "google-cloud-aiplatform[agent_engines,adk]>=1.112,<2",
  "google-cloud-firestore>=2.21,<3",
  "google-cloud-pubsub>=2.31,<3",
  "opentelemetry-api>=1.39,<2",
  "opentelemetry-sdk>=1.39,<2",
]
cloud = [
  "google-cloud-aiplatform[agent_engines,adk]>=1.112,<2",
  "google-cloud-firestore>=2.21,<3",
  "google-cloud-modelarmor>=0.4,<1",
  "google-cloud-pubsub>=2.31,<3",
  "google-cloud-secret-manager>=2.24,<3",
  "opentelemetry-api>=1.39,<2",
  "opentelemetry-sdk>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.39,<2",
  "google-auth>=2.40,<3",
  "grpcio>=1.75,<2",
]
api = [
  "fastapi>=0.133,<1",
  "python-dotenv>=1.0,<2",
  "uvicorn>=0.34,<1",
]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
tenure-demo = "tenure.demo:main"
tenure-api = "tenure.api:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tenure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
